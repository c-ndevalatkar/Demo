name: CI/CD Pipeline

on:
  push:
    branches:
      - master
     #  - main
     # - development
     # - 'QA/**'
     # - 'Release/**'
  pull_request:
    branches:
      - master
      #- main
      #- development
      #- 'QA/**'
      #- 'Release/**'
  workflow_dispatch: {}

env:
  JAVA_VERSION: '21'
  MAVEN_VERSION: '3.9.6'
  SONAR_HOST_URL: 'http://amzphxdevops01.phx.ndchealth.com:9000'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/TEST-*.xml
          check_name: Unit Test Results

  code-quality:
    name: SonarQube Analysis
    runs-on: [self-hosted, internal-runner]
    needs: test
    # Run SonarQube on  development, master, QA/*, Release/* pushes or when manually triggered
    if: |
      (
        github.event_name == 'push' && 
        (
          github.ref == 'refs/heads/development' ||
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/heads/QA/') ||
          startsWith(github.ref, 'refs/heads/Release/')
        )
      ) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: SonarQube Scan
        shell: bash
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=demo1_project \
            -Dsonar.projectName=demo1 \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.event_name == 'pull_request' ||
      github.ref_name == 'master' ||
      github.ref_name == 'development' ||
      startsWith(github.ref_name, 'QA/') ||
      startsWith(github.ref_name, 'Release/')
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install --break-system-packages semgrep
      - name: Run Semgrep (JSON report)
        continue-on-error: false
        run: semgrep scan --config auto --json --output semgrep-report.json || true
      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
      - name: Analyze SAST report and fail on High/Critical
        run: |
          echo "Analyzing SAST report..."
          if [ -f semgrep-report.json ]; then
            TOTAL_FINDINGS=$(jq '.results | length' semgrep-report.json)
            # Semgrep severities are ERROR/WARNING/INFO; treat ERROR as High/Critical
            FAIL_COUNT=$(jq '[.results[] | select(.extra.severity=="ERROR")] | length' semgrep-report.json)

            if [ "$TOTAL_FINDINGS" -gt 0 ]; then
              echo "Found total $TOTAL_FINDINGS findings. Printing details below:"
              echo "======================================================================"
              jq -r '.results[] | "[Severity: \(.extra.severity)]\nFile: \(.path)\nLine: \(.start.line)\nIssue: \(.check_id)\nDescription: \(.extra.message)\n======================================================================"' semgrep-report.json

              if [ "$FAIL_COUNT" -gt 0 ]; then
                echo "❌ ERROR: Pipeline failed due to $FAIL_COUNT High/Critical (ERROR) findings!"
                exit 1
              else
                echo "✅ Only Low/Medium findings. Passed safely."
                exit 0
              fi
            else
              echo "✅ No SAST findings. Good to go!"
              exit 0
            fi
          else
            echo "✅ No SAST report found. Skipping."
          fi

  secret-detection:
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.event_name == 'pull_request' ||
      github.ref_name == 'master' ||
      github.ref_name == 'development' ||
      startsWith(github.ref_name, 'QA/') ||
      startsWith(github.ref_name, 'Release/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
        with:
          args: detect --report-format json --report-path gitleaks-report.json --exit-code 0
      - name: Analyze secret detection report
        run: |
          echo "Analyzing Secret Detection report..."
          if [ -f gitleaks-report.json ]; then
            LEAK_COUNT=$(jq 'length' gitleaks-report.json)
            if [ "$LEAK_COUNT" -gt 0 ]; then
              echo "❌ ERROR: $LEAK_COUNT secret(s) leaked in the repository!"
              echo "=========================================================="
              jq -r '.[] | "File: \(.File)\nLine: \(.StartLine)\nLeak Type: \(.Description)\n=========================================================="' gitleaks-report.json
              echo "Please remove the secrets, revoke them, and push again."
              exit 1
            else
              echo "✅ No secrets found. Code is secure."
              exit 0
            fi
          else
            echo "✅ No secret detection report found. Skipping."
          fi

  package:
    name: Package Application
    runs-on: ubuntu-latest
    needs: [test, security-scan, secret-detection]
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/development' || 
       startsWith(github.ref, 'refs/heads/QA/') ||
       startsWith(github.ref, 'refs/heads/Release/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Package
        run: mvn package -DskipTests

      - name: Create deployment package
        run: |
          mkdir -p deploy
          find target -type f -name "*.jar" -o -name "*.war" | xargs -I {} cp {} deploy/app.jar 2>/dev/null || true
          if [ ! -f deploy/app.jar ] && [ ! -f deploy/app.war ]; then
            cp target/demo1-*.jar deploy/app.jar || cp target/demo1-*.war deploy/app.war
          fi
          cd deploy && zip -r ../deploy-package.zip . && cd ..

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy-package.zip
          retention-days: 1

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: package
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/development'
    environment:
      name: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to Development
        run: |
          S3_KEY="demo1/portal_Dev/app/${{ github.sha }}-$(date +'%b-%d-%Y-%H-%M-%S')/deploy-package.zip"
          echo "Uploading package to S3..."
          aws s3 cp deploy-package.zip "s3://your-s3-bucket/${S3_KEY}"
          echo "Deployment package uploaded to S3"
          # Add AWS CodeDeploy call here if needed
        continue-on-error: true

  deploy-stage:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: package
    if: |
      github.event_name == 'push' && 
      startsWith(github.ref, 'refs/heads/QA/')
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Staging
        run: |
          S3_KEY="demo1/portal_Stage/app/${{ github.sha }}-$(date +'%b-%d-%Y-%H-%M-%S')/deploy-package.zip"
          echo "Uploading package to S3..."
          aws s3 cp deploy-package.zip "s3://${{ secrets.STAGE_S3_BUCKET }}/${S3_KEY}"
          echo "Deployment package uploaded to S3"
          # Add AWS CodeDeploy call here if needed
        continue-on-error: true

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: package
    if: |
      github.event_name == 'push' && 
      startsWith(github.ref, 'refs/heads/Release/')
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Production
        run: |
          S3_KEY="demo1/portal_Prod/app/${{ github.sha }}-$(date +'%b-%d-%Y-%H-%M-%S')/deploy-package.zip"
          echo "Uploading package to S3..."
          aws s3 cp deploy-package.zip "s3://${{ secrets.PROD_S3_BUCKET }}/${S3_KEY}"
          echo "Deployment package uploaded to S3"
          # Add AWS CodeDeploy call here if needed
        continue-on-error: true

